name: bu_horizon
description: BU Horizon - Smart Campus companion app for Barishal University.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.19.0
  url_launcher: ^6.2.6
  file_picker: ^10.3.7
  mime: ^1.0.6
  flutter_bloc: 8.1.6
  get_it: 7.7.0
  injectable: 2.4.0
  equatable: 2.0.5
  freezed_annotation: 2.4.4
  json_annotation: 4.8.1
  go_router: ^17.3.0
  supabase_flutter: ^2.16.0
  shared_preferences: ^2.3.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4


dev_dependencies:
  build_runner: 2.4.11
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: 2.5.2
  injectable_generator: 2.4.1
  json_serializable: 6.7.1
  mocktail: 1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/images/logo.png"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
