name: bu_horizon
description: BU Horizon - Smart Campus companion app for Barishal University.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.19.0
  url_launcher: ^6.2.6
  flutter_bloc: 8.1.6
  get_it: 7.7.0
  injectable: 2.4.0
  equatable: 2.0.5
  freezed_annotation: 2.4.4
  json_annotation: 4.8.1
  go_router: ^17.3.0


dev_dependencies:
  build_runner: 2.4.11
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: 2.5.2
  injectable_generator: 2.4.1
  json_serializable: 6.7.1
  mocktail: 1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

